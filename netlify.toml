# Netlify build configuration for the Next.js app.
#
# Let Netlify auto-detect and run the Next.js adapter. We pin the build
# command and Node version so a fresh clone builds the same way CI and
# local dev do. Next.js 16 requires Node >= 20.9.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
