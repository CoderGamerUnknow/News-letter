name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Next 16 defines the PageProps/LayoutProps route types in
      # .next/types/*.d.ts, referenced by the gitignored next-env.d.ts. A fresh
      # clone has neither, so a bare `tsc` fails with TS2304 until the route
      # types exist. `next typegen` writes them without a full production build.
      - name: Generate route types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      # `npm run build` triggers the `prebuild` news fetch. That script keeps
      # the last snapshot when feeds are unreachable and never fails the build,
      # so CI stays green even with no network access to the RSS sources.
      - name: Build
        run: npm run build
